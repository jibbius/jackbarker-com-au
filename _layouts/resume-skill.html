---
layout: default
---

<article class="career-skill">
  <header class="skill-header">
    <h1>{{ page.title }}</h1>
    <div class="skill-meta">
      <div class="category">{{ page.category }}</div>
    </div>
  </header>

  <div class="skill-content">
    {{ content }}
  </div>

  {% if page.skills and page.skills.size > 0 %}
  <div class="skills-list">
    <h3>Skills & Technologies:</h3>
    <ul>
      {% for skill in page.skills %}
        <li>{{ skill }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <nav class="skill-navigation">
    <a href="/resume/" class="back-to-resume">← Back to Resume</a>
  </nav>
</article>

<style>
.career-skill {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

.skill-header {
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid #e1e1e1;
}

.skill-header h1 {
  margin-bottom: 1rem;
  color: #333;
}

.skill-meta {
  color: #666;
}

.category {
  font-weight: bold;
}

.skill-content {
  line-height: 1.6;
  margin-bottom: 2rem;
}

.skills-list {
  margin-bottom: 2rem;
  padding: 1.5rem;
  background: #f8f9fa;
  border-radius: 8px;
  border: 1px solid #e1e1e1;
}

.skills-list h3 {
  margin-top: 0;
  margin-bottom: 1rem;
  color: #333;
}

.skills-list ul {
  list-style-type: disc;
  margin-left: 1.5rem;
  margin-bottom: 0;
}

.skills-list li {
  margin-bottom: 0.5rem;
  color: #555;
}

.skill-navigation {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid #e1e1e1;
}

.back-to-resume {
  display: inline-block;
  padding: 0.5rem 1rem;
  background: #f5f5f5;
  color: #333;
  text-decoration: none;
  border-radius: 4px;
  border: 1px solid #ddd;
  transition: background-color 0.2s;
}

.back-to-resume:hover {
  background: #e9e9e9;
  text-decoration: none;
}

@media (max-width: 768px) {
  .career-skill {
    padding: 1rem;
  }
  
  .skills-list {
    padding: 1rem;
  }
}
</style>
