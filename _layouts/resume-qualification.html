---
layout: default
---

<article class="career-qualification">
  <header class="qualification-header">
    <h1>{{ page.title }}</h1>
    <div class="qualification-meta">
      <div class="institution">{{ page.institution }}</div>
      <div class="completion-date">Completed: {{ page.completion_date }}</div>
      <div class="type">{{ page.type }}</div>
    </div>
  </header>

  <div class="qualification-content">
    {{ content }}
  </div>

  <nav class="qualification-navigation">
    <a href="/resume/" class="back-to-resume">← Back to Resume</a>
  </nav>
</article>

<style>
.career-qualification {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

.qualification-header {
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid #e1e1e1;
}

.qualification-header h1 {
  margin-bottom: 1rem;
  color: #333;
}

.qualification-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  color: #666;
}

.institution {
  font-weight: bold;
}

.completion-date {
  font-style: italic;
}

.type {
  color: #888;
}

.qualification-content {
  line-height: 1.6;
  margin-bottom: 2rem;
}

.qualification-content h2 {
  margin-top: 2rem;
  margin-bottom: 1rem;
  color: #333;
  border-bottom: 1px solid #e1e1e1;
  padding-bottom: 0.5rem;
}

.qualification-navigation {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid #e1e1e1;
}

.back-to-resume {
  display: inline-block;
  padding: 0.5rem 1rem;
  background: #f5f5f5;
  color: #333;
  text-decoration: none;
  border-radius: 4px;
  border: 1px solid #ddd;
  transition: background-color 0.2s;
}

.back-to-resume:hover {
  background: #e9e9e9;
  text-decoration: none;
}

@media (max-width: 768px) {
  .qualification-meta {
    grid-template-columns: 1fr;
    gap: 0.5rem;
  }
  
  .career-qualification {
    padding: 1rem;
  }
}
</style>
