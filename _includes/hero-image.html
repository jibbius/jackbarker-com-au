{% assign class='hero-image' | append: ' ' | append: include.class %}
{% assign img_ext=include.ext | default: '.jpg' %}
{% assign caption_placement=include.caption_placement | default: 'bottom' %}

<figure class="{{class}}">
    {% if include.caption and caption_placement=='top' %}
    <figcaption>{{ include.caption }}</figcaption>
    {% endif %}
    
    <img
        {% assign srcset_all='' %}
        {% if include.raw == 'true' %}
            {% assign img_src=site.baseurl | append: site.img_root | append: include.img | append: img_ext %}
            src="{{ img_src }}"
        {% else %}
            {% assign img_res=site.img_size.standard_width[0] | append: 'w' %}
            {% assign img_src=site.baseurl | append: site.img_root | append: include.img | append: '-' | append: img_res | append: img_ext %}
            
            {% for width in site.img_size.standard_width %}
                {% assign srctoken=site.baseurl | append: site.img_root | append: include.img | append: '-' | append: width | append: 'w' | append: img_ext | append: ' ' | append: width | append: 'w' %}
                {% if srcset_all==undefined or srcset_all=='' %}
                {% else %}
                    {% assign srcset_all=srcset_all | append: ', ' %}
                {% endif %}
                {% assign srcset_all=srcset_all | append: srctoken %}
            {% endfor%}
            
            src="{{ img_src }}"
            srcset="{{srcset_all}}"
            sizes="(min-width: 1200px) 1200px, (min-width: 800px) 100vw, 100vw"
        {% endif %}
        
        alt="{{ include.alt }}"
        title="{{ include.alt }}"
        loading="lazy"
    />
    
    {% if include.caption and caption_placement=='bottom'%}
    <figcaption>{{ include.caption }}</figcaption>
    {% endif %}
</figure>

<style>
.hero-image {
    margin: 2rem 0;
    width: 100%;
    max-width: none;
}

.hero-image img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
}

.hero-image:hover img {
    transform: scale(1.02);
}

.hero-image figcaption {
    text-align: center;
    font-style: italic;
    color: #666;
    margin-top: 1rem;
    font-size: 0.9em;
}

@media (max-width: 768px) {
    .hero-image {
        margin: 1rem 0;
    }
    
    .hero-image img {
        border-radius: 4px;
    }
}
</style>
